<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Oracle Bauble ✦ Christmas Edition</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: transparent;
    font-family: Georgia, "Times New Roman", serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* DESKTOP: bauble (dominant) and instructions side by side, centred on the same horizontal line */
  .layout {
    display: flex;
    flex-direction: row;
    align-items: center;        /* vertical middles level with each other */
    justify-content: center;
    gap: 2vw;
    padding: 0 2vw;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrapper {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .bauble-wrap {
    position: relative;
    width: min(62vw, 100vh);    /* up to 62% of the width, never taller than the screen */
    width: min(62vw, 100dvh);
    aspect-ratio: 1;
    cursor: pointer;
    touch-action: manipulation;
    container-type: size;       /* answer text scales with the bauble */
  }
  .static-side {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .static-side img {
    display: block;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    object-fit: contain;
    height: auto;
    pointer-events: none;
  }

  /* MOBILE: stacked and centred, bauble full width */
  @media (max-width: 700px), (max-aspect-ratio: 1/1) {
    .layout {
      flex-direction: column;
      justify-content: flex-start;
      gap: 0;
      padding: 0 0 24px;
    }
    .bauble-wrap { width: min(100vw, 900px); }
    .static-side { flex: none; width: 100%; justify-content: center; }
    .static-side img { width: min(92vw, 480px); }
  }

  /* --- bauble, answer text and shake: unchanged from your original --- */
  .bauble {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    pointer-events: none;
    transform-origin: 50% 53%;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.22));
  }
  .answer-window {
    position: absolute;
    left: 50%;
    top: 53.7%;
    transform: translate(-50%, -50%);
    width: 41%;
    height: 31%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 5%;
    pointer-events: none;
  }
  .answer {
    width: 100%;
    color: #fff0bd;
    font: 700 clamp(10px, 2.15vw, 17px)/1.35 Georgia, "Times New Roman", serif;
    text-align: center;
    white-space: pre-line;
    text-shadow: 0 0 5px #ffb52c, 0 0 12px rgba(255, 177, 35, .9), 1px 2px 2px #4b1300;
    opacity: 0;
    transition: opacity .35s ease;
    overflow-wrap: break-word;
  }
  .answer.visible { opacity: 1; }
  .bauble-wrap:active .bauble { transform: scale(.985); }
  .wrapper.shaking .bauble { animation: bauble-shake .72s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes bauble-shake {
    0% { transform: rotate(0) translate(0,0); }
    12% { transform: rotate(-4deg) translate(-5px,0); }
    24% { transform: rotate(4deg) translate(5px,1px); }
    36% { transform: rotate(-5deg) translate(-4px,-1px); }
    48% { transform: rotate(4deg) translate(4px,0); }
    60% { transform: rotate(-3deg) translate(-3px,0); }
    75% { transform: rotate(2deg) translate(2px,0); }
    100% { transform: rotate(0) translate(0,0); }
  }

  /* text never drops below 10px, so it stays readable */
  .answer { font-size: clamp(10px, 2.9cqw, 17px); }
  @media (prefers-reduced-motion: reduce) {
    .wrapper.shaking .bauble { animation-duration: .15s; }
    .answer { transition: none; }
  }
</style>
</head>
<body>
<div class="layout">
  <main class="wrapper" id="wrapper">
    <div class="bauble-wrap" id="baubleWrap" role="button" tabindex="0" aria-label="Tap to consult the Oracle Bauble">
      <img class="bauble" src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjWjz4BeO-P9DKrrjizIBdRw3KDvZyBvwjrDjr2DmCSAIGz8vIX8rfq-rJlb199VlDIRyyb070c6KNjmyOUfNvR33zxmdlYOR8Jc8lubGwBWFpAKOD8Xx0MA81knfGlR1AZjpIbNr4kXmaP6Ezkh1-3gCq4DFEWxUF395iM60CIKOEGvXZlyACneUauVREU/s1261/Ornate%20Ruby%20Christmas%20Bauble.png" alt="Ornate red Christmas bauble">
      <div class="answer-window"><div class="answer" id="answerText" aria-live="polite">?</div></div>
    </div>
  </main>
  <aside class="static-side">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhxSLA6dwAevOx2X0vBUqJ4CZWMPJsb4zHU4_G1UWSeSMRBL8uZGXDkOr1ki5iGkRm4ECKbAFmtLrzr4yJbSQMHh6xcaoVRcUfkCJZ-swehJQ3WwZmxklZSssSJzOutr30xqz3AA_adW9Dtq3eRBiF6yKDE1_EDvkQg9ipfghhpupkJqZDAk_pAIUYZ1uWy/s1042/Oracle%20Bauble%20Instructions.png" alt="Oracle Bauble - Christmas Edition. Tap the bauble, get your answer. Shake on mobile. Consult at your own risk.">
  </aside>
</div>
<script>
  const answers = [
    "The elves have checked.\nProceed with festive confidence.",
    "A resounding yes.\nProbably involving glitter.",
    "The answer is hiding\nbehind the Quality Street.",
    "Ask again after\na mince pie.",
    "The reindeer are\ncautiously optimistic.",
    "A tiny bell says yes.",
    "The wrapping paper\nknows more than it admits.",
    "Absolutely.\nBut mind the tinsel.",
    "The North Pole says\n'give it a go'.",
    "Not today.\nThe baubles are busy.",
    "The turkey has\nno comment.",
    "Signs point to\nan unexpected pudding.",
    "The answer is\nsomewhere in the loft.",
    "A mysterious elf\nhas approved this.",
    "The festive vibes\nare suspiciously strong.",
    "Yes, with a side\nof cranberry sauce.",
    "The snow globe\nhas declined to comment.",
    "Do not trust\nthe novelty cracker.",
    "The spirit of Christmas\nsays maybe.",
    "The answer is buried\nunder the sellotape.",
    "The stockings are\nleaning towards yes.",
    "A little chaos\nis wonderfully seasonal.",
    "The gingerbread council\nrequires more evidence.",
    "No.\nAnd that's final-ish.",
    "The mince pies\nforetell great things.",
    "Ask the tree.\nIt looks informed.",
    "A festive miracle\nis entirely possible.",
    "The answer is\nwrapped in mystery.",
    "Proceed.\nBut save the receipt.",
    "The snowmen agree.\nThe snowmen are rarely wrong.",
    "A reindeer has sneezed.\nTake that as a sign.",
    "The outlook is bright\nwith a chance of sprouts.",
    "The elves are divided.\nThere may be a recount.",
    "Yes!\nNow act natural.",
    "The bauble whispers:\n'not a chance'.",
    "The answer is\nmore complicated than a gift bow.",
    "Trust your instincts.\nAnd check the oven.",
    "The Christmas pudding\nhas spoken.",
    "A jolly little yes.",
    "Absolutely not.\nGo have a biscuit.",
    "The tinsel is aligned.\nThis is promising.",
    "Your destiny involves\nan alarming amount of ribbon.",
    "The bells say yes.\nThe bells are very loud.",
    "Unclear.\nSomeone ate the instructions.",
    "The festive forecast:\nmostly favourable.",
    "Nope.\nEven the elves said nope.",
    "A surprise is coming.\nPossibly a novelty mug.",
    "The answer is\nunder the tree. Somewhere.",
    "The reindeer council\nrequests patience.",
    "Yes, but only\nif you bring snacks.",
    "The bauble has seen things.\nIt recommends caution.",
    "A star has twinkled.\nThat's basically confirmation.",
    "The answer is\nlost in the wrapping.",
    "Not yet.\nLet the kettle boil.",
    "The holly says yes.\nThe ivy says 'maybe'.",
    "A festive opportunity\nis jingling nearby.",
    "The elves have voted.\nThe result is confidential.",
    "Absolutely.\nMake it gloriously ridiculous.",
    "The answer is\nsprout-shaped. Sorry.",
    "The North Pole is\nexperiencing technical difficulties.",
    "A little patience\nwill work wonders.",
    "The snow is falling.\nThe answer is not.",
    "Yes.\nAnd there may be cake.",
    "The cracker joke\nwas a warning.",
    "The future looks merry\nand mildly chaotic.",
    "Consult again\nwhen the lights stop flashing.",
    "The bauble approves.\nThe bauble has excellent taste.",
    "A very strong maybe.\nWith cinnamon.",
    "No further questions.\nEnjoy your Christmas.",
    "The answer is\nsomewhere between ho ho and oh no.",
    "A festive gremlin\nis on your side.",
    "The stars say yes.\nThe sprouts say nothing.",
    "This is your sign.\nProbably.",
    "The wrapping has begun.\nThere is no turning back.",
    "The answer is\nin the last place you look.",
    "Go forth.\nBe merry. Be sensible-ish."
  ];
  let lastIndex = -1;
  let isShaking = false;
  const wrapper = document.getElementById("wrapper");
  const baubleWrap = document.getElementById("baubleWrap");
  const answerEl = document.getElementById("answerText");

  function getAnswer() {
    let index;
    do { index = Math.floor(Math.random() * answers.length); }
    while (index === lastIndex && answers.length > 1);
    lastIndex = index;
    return answers[index];
  }

  function consult() {
    if (isShaking) return;
    isShaking = true;
    answerEl.classList.remove("visible");
    wrapper.classList.add("shaking");
    wrapper.addEventListener("animationend", () => {
      wrapper.classList.remove("shaking");
      answerEl.textContent = getAnswer();
      answerEl.classList.add("visible");
      isShaking = false;
    }, { once: true });
  }

  baubleWrap.addEventListener("click", consult);
  baubleWrap.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      consult();
    }
  });

  let lastShakeTime = 0;
  if (window.DeviceMotionEvent) {
    window.addEventListener("devicemotion", (event) => {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;
      const total = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
      const now = Date.now();
      if (total > 25 && now - lastShakeTime > 1100) {
        lastShakeTime = now;
        consult();
      }
    });
  }

  if (typeof DeviceMotionEvent !== "undefined" &&
      typeof DeviceMotionEvent.requestPermission === "function") {
    baubleWrap.addEventListener("click", () => {
      DeviceMotionEvent.requestPermission().catch(() => {});
    }, { once: true });
  }
</script>
</body>
</html>
